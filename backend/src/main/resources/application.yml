spring:
  application:
    name: grantflow-pro

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grantflow}
    username: ${SPRING_DATASOURCE_USERNAME:grantflow}
    password: ${SPRING_DATASOURCE_PASSWORD:grantflow}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-something-longer-in-production}
    expiration-ms: 86400000

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:grantflow-documents-demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html



app:
  storage:
    mode: ${STORAGE_MODE:local}
    local-upload-dir: ${LOCAL_UPLOAD_DIR:uploads}
    s3-bucket: ${AWS_S3_BUCKET:}
    s3-region: ${AWS_REGION:us-east-1}
